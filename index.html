<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gym & Nutrition Multi-User</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #09090B;
      --card: #121215;
      --accent: #6366F1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --green: #10B981;
      --text: #F4F4F5;
      --sub: #71717A;
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.3);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; max-width: 100%; overflow-x: hidden !important; background-color: var(--bg); color: var(--text); }
    body { padding: 12px; padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(90px, env(safe-area-inset-bottom)); }

    /* Auth Screen */
    #auth-screen { display: flex; flex-direction: column; justify-content: center; min-height: 80vh; max-width: 380px; margin: 0 auto; }
    
    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .app-title { font-size: 1.25rem; font-weight: 800; background: linear-gradient(135deg, #FFF 30%, var(--sub)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .nav-tabs { display: flex; gap: 4px; margin-bottom: 14px; background: rgba(255, 255, 255, 0.03); padding: 3px; border-radius: 12px; border: 1px solid var(--border); width: 100%; }
    .tab-btn { flex: 1; padding: 10px 0; text-align: center; background: none; border: none; color: var(--sub); font-weight: 600; font-size: 0.8rem; border-radius: 99px; cursor: pointer; }
    .tab-btn.active { background: var(--accent); color: #FFF; font-weight: 700; box-shadow: 0 4px 15px var(--accent-glow); }

    .card { background: var(--card); border-radius: 16px; padding: 14px; border: 1px solid var(--border); margin-bottom: 12px; width: 100%; }
    .card-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

    .control-panel { background: var(--card); border-radius: 16px; padding: 12px; border: 1px solid var(--border); margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .panel-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
    
    input[type="date"], input[type="number"], input[type="text"], input[type="password"], select { 
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; outline: none; width: 100%; min-width: 0; -webkit-appearance: none; margin-bottom: 8px;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }

    .day-selector { display: flex; gap: 4px; width: 100%; }
    .day-btn { flex: 1; padding: 9px 0; text-align: center; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); color: var(--sub); font-weight: 600; font-size: 0.8rem; border-radius: 8px; cursor: pointer; }
    .day-btn.active { background: rgba(99, 102, 241, 0.15); color: var(--accent); font-weight: 700; border-color: var(--border-accent); }

    .week-strip { display: flex; justify-content: space-between; gap: 3px; width: 100%; }
    .day-pill { flex: 1; text-align: center; padding: 8px 0; background: rgba(255, 255, 255, 0.02); border-radius: 8px; border: 1px solid var(--border); font-size: 0.75rem; font-weight: 600; min-width: 0; }
    .day-pill.today { border-color: var(--accent); background: var(--accent-glow); color: #FFF; font-weight: 800; }
    .day-name { color: var(--sub); font-size: 0.6rem; margin-bottom: 2px; text-transform: uppercase; }

    .progress-bar-bg { width: 100%; height: 10px; background: rgba(255, 255, 255, 0.05); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); margin: 10px 0; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); width: 0%; border-radius: 99px; transition: width 0.4s ease; }

    .exercise-card { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); width: 100%; }
    .exercise-title { font-size: 0.88rem; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; }
    .set-container { margin-bottom: 8px; width: 100%; }
    .set-row { display: grid; grid-template-columns: 42px 1fr 1fr; gap: 6px; align-items: center; width: 100%; }
    .set-row input { text-align: center; font-weight: 700; margin-bottom: 0; }
    .last-val-hint { font-size: 0.68rem; color: var(--sub); margin-top: 2px; text-align: right; grid-column: 2 / 4; }

    .btn-small { padding: 8px 12px; background: var(--accent); color: #FFF; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }
    .btn-outline { padding: 6px 10px; background: transparent; color: var(--sub); border: 1px solid var(--border); border-radius: 6px; font-size: 0.7rem; cursor: pointer; }
    .save-btn { width: 100%; padding: 14px; background: var(--accent); color: #FFF; border: none; border-radius: 12px; font-size: 0.9rem; font-weight: 800; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 20px var(--accent-glow); }
    .chart-container { height: 140px; width: 100%; margin-top: 6px; }

    .user-badge { font-size: 0.75rem; font-weight: 700; color: var(--accent); background: rgba(99, 102, 241, 0.15); padding: 4px 8px; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="auth-screen">
    <div class="card">
      <div class="card-title" style="justify-content: center; font-size: 1.2rem; margin-bottom: 16px;">GymTracker Login</div>
      <input type="text" id="auth-user" placeholder="Benutzername (z.B. Elias)">
      <input type="password" id="auth-password" placeholder="Passwort">
      <button class="save-btn" onclick="handleCustomLogin()">Anmelden</button>
    </div>
  </div>

  <!-- HAUPT APP -->
  <div id="app-screen" style="display: none;">
    <div class="top-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="app-title">GymTracker Pro</div>
        <div id="current-user-tag" class="user-badge"></div>
      </div>
      <button class="btn-outline" onclick="handleLogout()">Abmelden</button>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-btn-workout" onclick="switchMainTab('WORKOUT')">🏋️ Workout</button>
      <button class="tab-btn" id="tab-btn-dash" onclick="switchMainTab('DASHBOARD')">📊 Dashboard</button>
    </div>

    <!-- REITER 1: WORKOUT -->
    <div id="view-workout">
      <div class="control-panel">
        <div class="panel-row">
          <span style="font-size: 0.8rem; font-weight: 600; color: var(--sub); white-space: nowrap;">Datum:</span>
          <input type="date" id="workout-date" onchange="renderWorkout()">
        </div>
        <div class="panel-row">
          <div class="day-selector">
            <button class="day-btn active" onclick="switchDay('A')">Push</button>
            <button class="day-btn" onclick="switchDay('B')">Pull</button>
            <button class="day-btn" onclick="switchDay('C')">Legs</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>Progress</span>
          <span style="font-size:0.78rem; color:var(--green); font-weight:800;" id="growth-val">+0.0%</span>
        </div>
        <select id="view-mode" onchange="handleModeChange()" style="margin-bottom:6px;">
          <option value="PLAN">Gesamter Trainingsplan</option>
          <option value="EXERCISE">Einzelne Übung</option>
        </select>
        <select id="exercise-picker" style="display: none; margin-bottom:6px;" onchange="renderChart()"></select>
        <div class="chart-container"><canvas id="progressChart"></canvas></div>
      </div>

      <div id="workout-container"></div>
      <button class="save-btn" onclick="saveData()">Einheit Speichern</button>
    </div>

    <!-- REITER 2: DASHBOARD -->
    <div id="view-dashboard" style="display: none;">
      <div class="card">
        <div class="card-title">Wochenansicht</div>
        <div class="week-strip" id="week-strip"></div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>Körpergewichtsverlauf</span>
          <span style="font-size:0.78rem; color:var(--accent); font-weight:800;" id="latest-weight-display">-- kg</span>
        </div>
        <div class="chart-container"><canvas id="weightChart"></canvas></div>
      </div>

      <div class="card">
        <div class="card-title">Gewicht eintragen</div>
        <div style="display: flex; gap: 6px; margin-bottom: 6px;">
          <input type="number" step="0.1" id="user-weight" placeholder="Gewicht (kg)">
          <button class="btn-small" onclick="saveWeight()">Sichern</button>
        </div>
        <div style="font-size: 0.78rem; color: var(--sub);" id="protein-target-text">Täglicher Zielbedarf: 0 g</div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>Protein Intake (Heute)</span>
          <span id="protein-count-text" style="color: var(--accent); font-weight:800;">0 / 0 g</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="protein-progress"></div>
        </div>
        <div style="display: flex; gap: 6px; margin-top: 8px;">
          <input type="number" id="protein-input" placeholder="Gramm (z.B. 40)">
          <button class="btn-small" onclick="addProtein()">+ Hinzufügen</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://djqjrgfiwlhqvchivxqe.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqcWpyZ2Zpd2xocXZjaGl2eHFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MjAzMzUsImV4cCI6MjEwMDk5NjMzNX0.3UxQM7UWKsdImLulIKakDNDfPU73Hnt6mUyHQ7ptgNU';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // MAPPING DER VORDEFINIERTEN ACCOUNTS
    const VALID_USERS = {
      "elias": { email: "elias@gymtracker.app", pass: "Elias123!", name: "Elias" },
      "anh": { email: "anh@gymtracker.app", pass: "Anh12345!", name: "Anh" },
      "denni": { email: "denni@gymtracker.app", pass: "Denni123!", name: "Denni" }
    };

    const exercisesConfig = {
      A: [
        { name: "1. KH-Schrägbankdrücken", sets: 3 },
        { name: "2. Brustpresse (Maschine)", sets: 3 },
        { name: "3. Cable Flys", sets: 3 },
        { name: "4. Seitheben Kabelzug", sets: 3 },
        { name: "5. Überkopf-Trizepsdrücken", subtitle: "Langer Kopf Stretch", sets: 3 }
      ],
      B: [
        { name: "1. Latzug Parallelgriff", sets: 3 },
        { name: "2. Rudern Maschine", sets: 3 },
        { name: "3. Straight Rows Kabel", sets: 3 },
        { name: "4. Face Pulls", sets: 3 },
        { name: "5. Preacher Curls / Hammer", subtitle: "Stretch Fokus", sets: 3 }
      ],
      C: [
        { name: "1. Beinbeuger sitzend", subtitle: "Vorermüdung", sets: 3 },
        { name: "2. Beinpresse (Quad-Fokus)", sets: 3 },
        { name: "3. Beinpresse (Breit/Hoch)", sets: 3 },
        { name: "4. Beinstrecker", sets: 3 },
        { name: "5. Wadenheben", sets: 3 },
        { name: "6. Cable Crunches", sets: 3 }
      ]
    };

    let currentDay = 'A';
    let dbHistory = [];
    let weightHistory = [];
    let userWeight = 75;
    let todayProtein = 0;
    let currentUser = null;
    let myChart = null;
    let myWeightChart = null;

    const todayStr = new Date().toISOString().split('T')[0];

    async function init() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        currentUser = user;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        
        const username = user.user_metadata?.name || "User";
        document.getElementById('current-user-tag').innerText = username;
        document.getElementById('workout-date').value = todayStr;
        
        await loadAllData();
        renderWeekStrip();
        switchDay('A');
      } else {
        document.getElementById('auth-screen').style.display = 'flex';
        document.getElementById('app-screen').style.display = 'none';
      }
    }

    async function handleCustomLogin() {
      const usernameInput = document.getElementById('auth-user').value.trim().toLowerCase();
      const passwordInput = document.getElementById('auth-password').value.trim();

      const account = VALID_USERS[usernameInput];
      if (!account || (passwordInput.toLowerCase() !== usernameInput)) {
        return alert("Ungültige Zugangsdaten! Erlaubt sind Elias, Anh und Denni.");
      }

      // Versuche Login
      let { data, error } = await supabaseClient.auth.signInWithPassword({
        email: account.email,
        password: account.pass
      });

      // Falls Account in Supabase noch nicht existiert, registriere ihn automatisch
      if (error) {
        const { data: signUpData, error: signUpErr } = await supabaseClient.auth.signUp({
          email: account.email,
          password: account.pass,
          options: { data: { name: account.name } }
        });

        if (signUpErr) {
          return alert("Fehler beim Erstellen des Accounts: " + signUpErr.message);
        }
        
        // Nach Registrierung erneut einloggen
        const { data: retryData } = await supabaseClient.auth.signInWithPassword({
          email: account.email,
          password: account.pass
        });
      }

      init();
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    function switchMainTab(tab) {
      document.getElementById('view-workout').style.display = (tab === 'WORKOUT') ? 'block' : 'none';
      document.getElementById('view-dashboard').style.display = (tab === 'DASHBOARD') ? 'block' : 'none';
      document.getElementById('tab-btn-workout').classList.toggle('active', tab === 'WORKOUT');
      document.getElementById('tab-btn-dash').classList.toggle('active', tab === 'DASHBOARD');
      if (tab === 'DASHBOARD') renderWeightChart();
    }

    async function loadAllData() {
      const { data: workouts } = await supabaseClient.from('workouts').select('*');
      dbHistory = workouts || [];

      const { data: logs } = await supabaseClient.from('daily_logs').select('*');
      if (logs && logs.length > 0) {
        weightHistory = logs.filter(l => l.weight && l.weight > 0).sort((a, b) => new Date(a.date) - new Date(b.date));
        
        if (weightHistory.length > 0) {
          userWeight = weightHistory[weightHistory.length - 1].weight;
          document.getElementById('latest-weight-display').innerText = `${userWeight} kg`;
        }

        const todayLog = logs.find(l => l.date === todayStr);
        if (todayLog) todayProtein = todayLog.protein || 0;
      }

      document.getElementById('user-weight').value = userWeight;
      updateProteinTarget();
      updateProteinUI();
      renderWeightChart();
    }

    function renderWeightChart() {
      const ctx = document.getElementById('weightChart');
      if (!ctx) return;
      
      const dates = weightHistory.map(w => w.date);
      const weights = weightHistory.map(w => w.weight);

      if (myWeightChart) myWeightChart.destroy();
      myWeightChart = new Chart(ctx.getContext('2d'), {
        type: 'line',
        data: {
          labels: dates.length ? dates : ['Keine Daten'],
          datasets: [{
            data: weights.length ? weights : [userWeight],
            borderColor: '#10B981',
            backgroundColor: 'rgba(16, 185, 129, 0.12)',
            fill: true,
            tension: 0.35,
            pointBackgroundColor: '#10B981'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#71717A' } },
            y: { ticks: { color: '#71717A' } }
          }
        }
      });
    }

    function renderWeekStrip() {
      const strip = document.getElementById('week-strip');
      strip.innerHTML = '';
      const now = new Date();
      const currentDayOfWeek = now.getDay() === 0 ? 6 : now.getDay() - 1;
      const monday = new Date(now);
      monday.setDate(now.getDate() - currentDayOfWeek);

      const days = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        const isToday = dateStr === todayStr;

        strip.innerHTML += `
          <div class="day-pill ${isToday ? 'today' : ''}">
            <div class="day-name">${days[i]}</div>
            <div>${d.getDate()}</div>
          </div>`;
      }
    }

    async function saveWeight() {
      const val = parseFloat(document.getElementById('user-weight').value);
      if (!val) return;
      userWeight = val;
      await supabaseClient.from('daily_logs').upsert({ date: todayStr, weight: userWeight, protein: todayProtein, user_id: currentUser.id });
      updateProteinTarget();
      await loadAllData();
      alert("Gewicht gesichert!");
    }

    function updateProteinTarget() {
      const target = Math.round(userWeight * 2.0);
      document.getElementById('protein-target-text').innerText = `Täglicher Zielbedarf: ${target} g (2,0g / kg)`;
      updateProteinUI();
    }

    async function addProtein() {
      const val = parseInt(document.getElementById('protein-input').value);
      if (!val) return;
      todayProtein += val;
      await supabaseClient.from('daily_logs').upsert({ date: todayStr, weight: userWeight, protein: todayProtein, user_id: currentUser.id });
      document.getElementById('protein-input').value = '';
      updateProteinUI();
    }

    function updateProteinUI() {
      const target = Math.round(userWeight * 2.0);
      document.getElementById('protein-count-text').innerText = `${todayProtein} / ${target} g`;
      const pct = Math.min(100, Math.round((todayProtein / target) * 100));
      document.getElementById('protein-progress').style.width = pct + '%';
    }

    function switchDay(day) {
      currentDay = day;
      document.querySelectorAll('.day-btn').forEach((btn, i) => {
        btn.classList.toggle('active', (i===0 && day==='A') || (i===1 && day==='B') || (i===2 && day==='C'));
      });
      renderWorkout();
      populateExercisePicker();
      renderChart();
    }

    function renderWorkout() {
      const container = document.getElementById('workout-container');
      container.innerHTML = '';
      const selectedDate = document.getElementById('workout-date').value || todayStr;

      exercisesConfig[currentDay].forEach((ex, exIdx) => {
        const card = document.createElement('div');
        card.className = 'exercise-card';
        let html = `<div class="exercise-title">${ex.name} ${ex.subtitle ? `<span style="font-size:0.72rem; color:var(--accent);">${ex.subtitle}</span>` : ''}</div>`;

        for(let s = 0; s < ex.sets; s++) {
          const exactEntry = dbHistory.find(h => h.date === selectedDate && h.day_type === currentDay && h.exercise_name === ex.name && h.set_number === (s + 1));
          const lastEntry = dbHistory.filter(h => h.exercise_name === ex.name && h.set_number === (s + 1) && h.date < selectedDate).pop();
          
          const currentW = exactEntry ? exactEntry.weight : '';
          const currentR = exactEntry ? exactEntry.reps : '';
          const hintText = lastEntry ? `Zuletzt: ${lastEntry.weight} kg × ${lastEntry.reps} Wdh.` : 'Zuletzt: Kein Eintrag';

          html += `
            <div class="set-container">
              <div class="set-row">
                <div style="font-size:0.78rem; color:var(--sub); font-weight:600;">Satz ${s + 1}</div>
                <input type="number" step="0.5" placeholder="kg" id="w_${exIdx}_${s}" value="${currentW}">
                <input type="number" placeholder="Wdh" id="r_${exIdx}_${s}" value="${currentR}">
              </div>
              <div class="last-val-hint">${hintText}</div>
            </div>`;
        }
        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    function populateExercisePicker() {
      const picker = document.getElementById('exercise-picker');
      picker.innerHTML = '';
      exercisesConfig[currentDay].forEach((ex) => {
        picker.innerHTML += `<option value="${ex.name}">${ex.name}</option>`;
      });
    }

    function handleModeChange() {
      const mode = document.getElementById('view-mode').value;
      document.getElementById('exercise-picker').style.display = (mode === 'EXERCISE') ? 'block' : 'none';
      renderChart();
    }

    function renderChart() {
      const mode = document.getElementById('view-mode').value;
      const selectedExercise = document.getElementById('exercise-picker').value;
      const filteredHistory = dbHistory.filter(h => h.day_type === currentDay);
      
      const dates = [...new Set(filteredHistory.map(h => h.date))].sort((a, b) => new Date(a) - new Date(b));
      let dataPoints = [];

      dates.forEach(d => {
        const dayLogs = filteredHistory.filter(h => h.date === d);
        let vol = 0;
        if (mode === "PLAN") {
          dayLogs.forEach(l => vol += (l.weight * l.reps));
        } else {
          dayLogs.filter(l => l.exercise_name === selectedExercise).forEach(l => vol += (l.weight * l.reps));
        }
        dataPoints.push(vol);
      });

      if (dataPoints.length >= 2) {
        const prev = dataPoints[dataPoints.length - 2];
        const curr = dataPoints[dataPoints.length - 1];
        const growth = prev > 0 ? (((curr - prev) / prev) * 100).toFixed(1) : 0;
        document.getElementById('growth-val').innerText = (growth >= 0 ? '+' : '') + growth + '%';
      } else {
        document.getElementById('growth-val').innerText = '+0.0%';
      }

      if (myChart) myChart.destroy();
      const ctx = document.getElementById('progressChart').getContext('2d');
      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dates.length ? dates : ['Keine Daten'],
          datasets: [{ data: dataPoints.length ? dataPoints : [0], borderColor: '#6366F1', backgroundColor: 'rgba(99, 102, 241, 0.12)', fill: true, tension: 0.35, pointBackgroundColor: '#6366F1' }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#71717A' } }, y: { ticks: { color: '#71717A' } } } }
      });
    }

    async function saveData() {
      const selectedDate = document.getElementById('workout-date').value || todayStr;
      let newEntries = [];

      exercisesConfig[currentDay].forEach((ex, exIdx) => {
        for(let s = 0; s < ex.sets; s++) {
          const w = parseFloat(document.getElementById(`w_${exIdx}_${s}`).value) || 0;
          const r = parseInt(document.getElementById(`r_${exIdx}_${s}`).value) || 0;
          
          if(w > 0 || r > 0) {
            newEntries.push({
              date: selectedDate,
              day_type: currentDay,
              exercise_name: ex.name,
              set_number: s + 1,
              weight: w,
              reps: r,
              user_id: currentUser.id
            });
          }
        }
      });

      if (newEntries.length === 0) return alert("Bitte mindestens ein Feld ausfüllen!");

      await supabaseClient.from('workouts').delete().eq('date', selectedDate).eq('day_type', currentDay).eq('user_id', currentUser.id);
      await supabaseClient.from('workouts').insert(newEntries);
      alert("Training für deinen Account gespeichert!");
      await loadAllData();
      renderWorkout();
    }

    window.onload = init;
  </script>
</body>
</html>
