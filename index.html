<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gym & Nutrition Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #09090B;
      --card: #121215;
      --card-hover: #18181C;
      --accent: #6366F1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --green: #10B981;
      --green-glow: rgba(16, 185, 129, 0.2);
      --text: #F4F4F5;
      --sub: #71717A;
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 90px; width: 100vw; overflow-x: hidden; }

    /* Glass Header / Tabs */
    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .app-title { font-size: 1.35rem; font-weight: 800; tracking: -0.02em; background: linear-gradient(135deg, #FFF 30%, var(--sub)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .nav-tabs { display: flex; gap: 6px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.03); padding: 4px; border-radius: 14px; border: 1px solid var(--border); backdrop-filter: blur(12px); }
    .tab-btn { flex: 1; padding: 11px 0; text-align: center; background: none; border: none; color: var(--sub); font-weight: 600; font-size: 0.85rem; border-radius: 10px; cursor: pointer; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    .tab-btn.active { background: var(--accent); color: #FFF; font-weight: 700; box-shadow: 0 4px 20px var(--accent-glow); }

    /* Cards */
    .card { background: var(--card); border-radius: 18px; padding: 18px; border: 1px solid var(--border); margin-bottom: 16px; transition: transform 0.2s ease, border-color 0.2s ease; }
    .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; letter-spacing: -0.01em; }

    /* Control Panel */
    .control-panel { background: var(--card); border-radius: 18px; padding: 16px; border: 1px solid var(--border); margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
    .panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    
    input[type="date"], input[type="number"], select { 
      background: rgba(255, 255, 255, 0.04); 
      border: 1px solid var(--border); 
      color: var(--text); 
      padding: 10px 12px; 
      border-radius: 10px; 
      font-size: 0.88rem; 
      font-weight: 600; 
      outline: none; 
      transition: all 0.2s ease;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    .day-selector { display: flex; gap: 6px; width: 100%; }
    .day-btn { flex: 1; padding: 10px 0; text-align: center; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); color: var(--sub); font-weight: 600; font-size: 0.85rem; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; }
    .day-btn.active { background: rgba(99, 102, 241, 0.15); color: var(--accent); font-weight: 700; border-color: var(--border-accent); }

    /* Week Strip */
    .week-strip { display: flex; justify-content: space-between; gap: 6px; }
    .day-pill { flex: 1; text-align: center; padding: 10px 0; background: rgba(255, 255, 255, 0.02); border-radius: 12px; border: 1px solid var(--border); font-size: 0.8rem; font-weight: 600; }
    .day-pill.today { border-color: var(--accent); background: var(--accent-glow); color: #FFF; font-weight: 800; box-shadow: 0 0 12px var(--accent-glow); }
    .day-name { color: var(--sub); font-size: 0.65rem; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }

    /* Protein Progress Bar */
    .progress-bar-bg { width: 100%; height: 12px; background: rgba(255, 255, 255, 0.05); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); margin: 12px 0; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); width: 0%; border-radius: 99px; transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 0 10px var(--green-glow); }

    /* Exercise Items */
    .exercise-card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
    .exercise-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .set-container { margin-bottom: 10px; }
    .set-container:last-child { margin-bottom: 0; }
    .set-row { display: grid; grid-template-columns: 50px 1fr 1fr; gap: 8px; align-items: center; }
    .last-val-hint { font-size: 0.72rem; color: var(--sub); margin-top: 4px; text-align: right; grid-column: 2 / 4; }

    .btn-small { padding: 10px 16px; background: var(--accent); color: #FFF; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.85rem; box-shadow: 0 2px 10px var(--accent-glow); transition: transform 0.1s ease; }
    .btn-small:active { transform: scale(0.96); }

    .save-btn { width: 100%; padding: 15px; background: var(--accent); color: #FFF; border: none; border-radius: 14px; font-size: 0.95rem; font-weight: 800; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 25px var(--accent-glow); transition: all 0.2s ease; }
    .save-btn:active { transform: scale(0.98); }

    .chart-container { height: 160px; width: 100%; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="app-title">GymTracker</div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" id="tab-btn-workout" onclick="switchMainTab('WORKOUT')">🏋️ Workout</button>
    <button class="tab-btn" id="tab-btn-dash" onclick="switchMainTab('DASHBOARD')">📊 Dashboard</button>
  </div>

  <!-- REITER 1: WORKOUT -->
  <div id="view-workout">
    <div class="control-panel">
      <div class="panel-row">
        <span style="font-size: 0.85rem; font-weight: 600; color: var(--sub);">Datum:</span>
        <input type="date" id="workout-date" onchange="renderWorkout()">
      </div>
      <div class="panel-row">
        <div class="day-selector">
          <button class="day-btn active" onclick="switchDay('A')">Push</button>
          <button class="day-btn" onclick="switchDay('B')">Pull</button>
          <button class="day-btn" onclick="switchDay('C')">Legs</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>Progress</span>
        <span style="font-size:0.8rem; color:var(--green); font-weight:800;" id="growth-val">+0.0%</span>
      </div>
      <select id="view-mode" onchange="handleModeChange()" style="margin-bottom:8px;">
        <option value="PLAN">Gesamter Trainingsplan</option>
        <option value="EXERCISE">Einzelne Übung</option>
      </select>
      <select id="exercise-picker" style="display: none; margin-bottom:8px;" onchange="renderChart()"></select>
      <div class="chart-container"><canvas id="progressChart"></canvas></div>
    </div>

    <div id="workout-container"></div>
    <button class="save-btn" onclick="saveData()">Einheit Speichern</button>
  </div>

  <!-- REITER 2: DASHBOARD -->
  <div id="view-dashboard" style="display: none;">
    <div class="card">
      <div class="card-title">Wochenansicht</div>
      <div class="week-strip" id="week-strip"></div>
    </div>

    <div class="card">
      <div class="card-title">Körpergewicht & Ziel</div>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="number" step="0.1" id="user-weight" placeholder="Gewicht (kg)">
        <button class="btn-small" onclick="saveWeight()">Sichern</button>
      </div>
      <div style="font-size: 0.8rem; color: var(--sub);" id="protein-target-text">Täglicher Zielbedarf: 0 g</div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>Protein Intake</span>
        <span id="protein-count-text" style="color: var(--accent); font-weight:800;">0 / 0 g</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="protein-progress"></div>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 12px;">
        <input type="number" id="protein-input" placeholder="Gramm (z.B. 40)">
        <button class="btn-small" onclick="addProtein()">+ Hinzufügen</button>
      </div>
    </div>
  </div>

  <script>
    const exercisesConfig = {
      A: [
        { name: "1. KH-Schrägbankdrücken", sets: 3 },
        { name: "2. Brustpresse (Maschine)", sets: 3 },
        { name: "3. Cable Flys", sets: 3 },
        { name: "4. Seitheben Kabelzug", sets: 3 },
        { name: "5. Überkopf-Trizepsdrücken", subtitle: "Langer Kopf Stretch", sets: 3 }
      ],
      B: [
        { name: "1. Latzug Parallelgriff", sets: 3 },
        { name: "2. Rudern Maschine", sets: 3 },
        { name: "3. Straight Rows Kabel", sets: 3 },
        { name: "4. Face Pulls", sets: 3 },
        { name: "5. Preacher Curls / Hammer", subtitle: "Stretch Fokus", sets: 3 }
      ],
      C: [
        { name: "1. Beinbeuger sitzend", subtitle: "Vorermüdung", sets: 3 },
        { name: "2. Beinpresse (Quad-Fokus)", sets: 3 },
        { name: "3. Beinpresse (Breit/Hoch)", sets: 3 },
        { name: "4. Beinstrecker", sets: 3 },
        { name: "5. Wadenheben", sets: 3 },
        { name: "6. Cable Crunches", sets: 3 }
      ]
    };

    let currentDay = 'A';
    let dbHistory = JSON.parse(localStorage.getItem('gym_history') || '[]');
    let userWeight = parseFloat(localStorage.getItem('gym_weight') || '75');
    let dailyProtein = JSON.parse(localStorage.getItem('gym_protein') || '{}');
    let myChart = null;

    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('workout-date').value = todayStr;

    function switchMainTab(tab) {
      document.getElementById('view-workout').style.display = (tab === 'WORKOUT') ? 'block' : 'none';
      document.getElementById('view-dashboard').style.display = (tab === 'DASHBOARD') ? 'block' : 'none';
      document.getElementById('tab-btn-workout').classList.toggle('active', tab === 'WORKOUT');
      document.getElementById('tab-btn-dash').classList.toggle('active', tab === 'DASHBOARD');
    }

    function init() {
      document.getElementById('user-weight').value = userWeight;
      updateProteinTarget();
      updateProteinUI();
      switchDay('A');
      renderWeekStrip();
    }

    function renderWeekStrip() {
      const strip = document.getElementById('week-strip');
      strip.innerHTML = '';
      const now = new Date();
      const currentDayOfWeek = now.getDay() === 0 ? 6 : now.getDay() - 1;
      const monday = new Date(now);
      monday.setDate(now.getDate() - currentDayOfWeek);

      const days = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        const isToday = dateStr === todayStr;

        strip.innerHTML += `
          <div class="day-pill ${isToday ? 'today' : ''}">
            <div class="day-name">${days[i]}</div>
            <div>${d.getDate()}</div>
          </div>`;
      }
    }

    function saveWeight() {
      const val = parseFloat(document.getElementById('user-weight').value);
      if (!val) return;
      userWeight = val;
      localStorage.setItem('gym_weight', val);
      updateProteinTarget();
      alert("Gewicht gesichert!");
    }

    function updateProteinTarget() {
      const target = Math.round(userWeight * 2.0);
      document.getElementById('protein-target-text').innerText = `Täglicher Zielbedarf: ${target} g (2,0g / kg)`;
      updateProteinUI();
    }

    function addProtein() {
      const val = parseInt(document.getElementById('protein-input').value);
      if (!val) return;
      dailyProtein[todayStr] = (dailyProtein[todayStr] || 0) + val;
      localStorage.setItem('gym_protein', JSON.stringify(dailyProtein));
      document.getElementById('protein-input').value = '';
      updateProteinUI();
    }

    function updateProteinUI() {
      const currentProtein = dailyProtein[todayStr] || 0;
      const target = Math.round(userWeight * 2.0);
      document.getElementById('protein-count-text').innerText = `${currentProtein} / ${target} g`;
      const pct = Math.min(100, Math.round((currentProtein / target) * 100));
      document.getElementById('protein-progress').style.width = pct + '%';
    }

    function switchDay(day) {
      currentDay = day;
      document.querySelectorAll('.day-btn').forEach((btn, i) => {
        btn.classList.toggle('active', (i===0 && day==='A') || (i===1 && day==='B') || (i===2 && day==='C'));
      });
      renderWorkout();
      populateExercisePicker();
      renderChart();
    }

    function renderWorkout() {
      const container = document.getElementById('workout-container');
      container.innerHTML = '';
      const selectedDate = document.getElementById('workout-date').value;

      exercisesConfig[currentDay].forEach((ex, exIdx) => {
        const card = document.createElement('div');
        card.className = 'exercise-card';
        let html = `<div class="exercise-title">${ex.name} ${ex.subtitle ? `<span style="font-size:0.75rem; color:var(--accent);">${ex.subtitle}</span>` : ''}</div>`;

        for(let s = 0; s < ex.sets; s++) {
          const exactEntry = dbHistory.find(h => h.date === selectedDate && h.day_type === currentDay && h.exercise_name === ex.name && h.set_number === (s + 1));
          const lastEntry = dbHistory.filter(h => h.exercise_name === ex.name && h.set_number === (s + 1) && h.date < selectedDate).pop();
          
          const currentW = exactEntry ? exactEntry.weight : '';
          const currentR = exactEntry ? exactEntry.reps : '';
          const hintText = lastEntry ? `Zuletzt: ${lastEntry.weight} kg × ${lastEntry.reps} Wdh.` : 'Zuletzt: Kein Eintrag';

          html += `
            <div class="set-container">
              <div class="set-row">
                <div style="font-size:0.8rem; color:var(--sub); font-weight:600;">Satz ${s + 1}</div>
                <input type="number" step="0.5" placeholder="kg" id="w_${exIdx}_${s}" value="${currentW}">
                <input type="number" placeholder="Wdh" id="r_${exIdx}_${s}" value="${currentR}">
              </div>
              <div class="last-val-hint">${hintText}</div>
            </div>`;
        }
        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    function populateExercisePicker() {
      const picker = document.getElementById('exercise-picker');
      picker.innerHTML = '';
      exercisesConfig[currentDay].forEach((ex) => {
        picker.innerHTML += `<option value="${ex.name}">${ex.name}</option>`;
      });
    }

    function handleModeChange() {
      const mode = document.getElementById('view-mode').value;
      document.getElementById('exercise-picker').style.display = (mode === 'EXERCISE') ? 'block' : 'none';
      renderChart();
    }

    function renderChart() {
      const mode = document.getElementById('view-mode').value;
      const selectedExercise = document.getElementById('exercise-picker').value;
      const filteredHistory = dbHistory.filter(h => h.day_type === currentDay);
      
      const dates = [...new Set(filteredHistory.map(h => h.date))];
      let dataPoints = [];

      dates.forEach(d => {
        const dayLogs = filteredHistory.filter(h => h.date === d);
        let vol = 0;
        if (mode === "PLAN") {
          dayLogs.forEach(l => vol += (l.weight * l.reps));
        } else {
          dayLogs.filter(l => l.exercise_name === selectedExercise).forEach(l => vol += (l.weight * l.reps));
        }
        dataPoints.push(vol);
      });

      if (dataPoints.length >= 2) {
        const prev = dataPoints[dataPoints.length - 2];
        const curr = dataPoints[dataPoints.length - 1];
        const growth = prev > 0 ? (((curr - prev) / prev) * 100).toFixed(1) : 0;
        document.getElementById('growth-val').innerText = (growth >= 0 ? '+' : '') + growth + '%';
      } else {
        document.getElementById('growth-val').innerText = '+0.0%';
      }

      if (myChart) myChart.destroy();
      const ctx = document.getElementById('progressChart').getContext('2d');
      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dates.length ? dates : ['Keine Daten'],
          datasets: [{ data: dataPoints.length ? dataPoints : [0], borderColor: '#6366F1', backgroundColor: 'rgba(99, 102, 241, 0.12)', fill: true, tension: 0.35, pointBackgroundColor: '#6366F1' }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#71717A' } }, y: { ticks: { color: '#71717A' } } } }
      });
    }

    function saveData() {
      const selectedDate = document.getElementById('workout-date').value;
      if (!selectedDate) return alert("Bitte wähle ein Datum aus!");

      exercisesConfig[currentDay].forEach((ex, exIdx) => {
        for(let s = 0; s < ex.sets; s++) {
          const w = parseFloat(document.getElementById(`w_${exIdx}_${s}`).value) || 0;
          const r = parseInt(document.getElementById(`r_${exIdx}_${s}`).value) || 0;
          
          if(w > 0 || r > 0) {
            dbHistory = dbHistory.filter(h => !(h.date === selectedDate && h.day_type === currentDay && h.exercise_name === ex.name && h.set_number === (s + 1)));
            dbHistory.push({
              date: selectedDate,
              day_type: currentDay,
              exercise_name: ex.name,
              set_number: s + 1,
              weight: w,
              reps: r
            });
          }
        }
      });

      localStorage.setItem('gym_history', JSON.stringify(dbHistory));
      alert("Training gespeichert!");
      renderChart();
      renderWorkout();
    }

    init();
  </script>
</body>
</html>
